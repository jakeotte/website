<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Redirecting – Jake Otte</title>
    <script>
    // Old shared links used post.html?slug=<slug>. Each post is now a static
    // page at <slug>.html, so send visitors (and crawlers) there.
    (function () {
        var slug = new URLSearchParams(location.search).get('slug');
        location.replace(slug && /^[a-z0-9-]+$/i.test(slug) ? slug + '.html' : '/');
    })();
    </script>
</head>
<body>
    <p><a href="/">Go to jakeotte.com</a></p>
</body>
</html>
